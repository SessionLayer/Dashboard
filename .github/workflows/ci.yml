name: CI

# Contract-first delivery gate for the Control Plane Dashboard. The single job id
# `gate` is the branch-protection required check — do not rename it or add a
# matrix, or auto-merge will hang waiting for a check that never reports.
on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref so a hung/old build does not sit in the
# queue or run to the default timeout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening); the
      # trailing comment records the human-readable tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Drift check against the pinned SessionLayer/Contracts tag. Git-only;
      # needs no npm ci.
      - name: Contract drift check (contracts.lock)
        run: npm run vendor-contracts:check

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Gate (lint, build, unit, e2e, audit, contract drift)
        run: npm run gate

  # Not the required check — `gate` is. This one keeps deploy/Dockerfile from
  # rotting into something nobody builds, and holds the image to the posture a
  # hardened deployment assumes.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: sessionlayer/dashboard:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

      # Compile proof only — nothing here needs to execute, so the result is not
      # loaded. The npm stage is reused from the amd64 build above.
      - name: Build arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          outputs: type=cacheonly
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

      # The Alpine nginx base has a shell by design, so the "no shell" assertion
      # the distroless components make has no counterpart here; the uid it runs
      # as is asserted instead.
      - name: Assert runtime posture
        env:
          IMG: sessionlayer/dashboard:ci
        run: |
          set -euo pipefail

          user=$(docker image inspect -f '{{.Config.User}}' "$IMG")
          case "$user" in
            '') echo "::error::image declares no USER"; exit 1 ;;
            root|0|0:0|root:root) echo "::error::image runs as root ($user)"; exit 1 ;;
          esac
          echo "USER=$user"

          uid=$(docker run --rm --entrypoint /usr/bin/id "$IMG" -u)
          if [ "$uid" = 0 ]; then
            echo "::error::container process runs as uid 0"
            exit 1
          fi
          echo "runtime uid=$uid"

          for label in title description source licenses version revision; do
            value=$(docker image inspect \
              -f "{{index .Config.Labels \"org.opencontainers.image.$label\"}}" "$IMG")
            if [ -z "$value" ] || [ "$value" = '<no value>' ]; then
              echo "::error::org.opencontainers.image.$label is unset"
              exit 1
            fi
            echo "org.opencontainers.image.$label=$value"
          done
