name: CI

# Contract-first delivery gate for the Control Plane Dashboard. The single job id
# `gate` is the branch-protection required check — do not rename it or add a
# matrix, or auto-merge will hang waiting for a check that never reports.
on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref so a hung/old build does not sit in the
# queue or run to the default timeout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening); the
      # trailing comment records the human-readable tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Drift check against the pinned SessionLayer/Contracts tag. Git-only;
      # needs no npm ci.
      - name: Contract drift check (contracts.lock)
        run: npm run vendor-contracts:check

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Gate (lint, build, unit, e2e, audit, contract drift)
        run: npm run gate

  # Not the required check — `gate` is. This one keeps deploy/Dockerfile from
  # rotting into something nobody builds, and holds the image to the posture a
  # hardened deployment assumes.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: sessionlayer/dashboard:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

      # Compile proof only — nothing here needs to execute, so the result is not
      # loaded. The npm stage is reused from the amd64 build above.
      - name: Build arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          outputs: type=cacheonly
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

      # The Alpine nginx base has a shell by design, so the "no shell" assertion
      # the distroless components make has no counterpart here; the uid it runs
      # as is asserted instead.
      - name: Assert runtime posture
        env:
          IMG: sessionlayer/dashboard:ci
        run: |
          set -euo pipefail

          user=$(docker image inspect -f '{{.Config.User}}' "$IMG")
          case "$user" in
            '') echo "::error::image declares no USER"; exit 1 ;;
            root|0|0:0|root:root) echo "::error::image runs as root ($user)"; exit 1 ;;
          esac
          echo "USER=$user"

          uid=$(docker run --rm --entrypoint /usr/bin/id "$IMG" -u)
          if [ "$uid" = 0 ]; then
            echo "::error::container process runs as uid 0"
            exit 1
          fi
          echo "runtime uid=$uid"

          for label in title description source licenses version revision; do
            value=$(docker image inspect \
              -f "{{index .Config.Labels \"org.opencontainers.image.$label\"}}" "$IMG")
            if [ -z "$value" ] || [ "$value" = '<no value>' ]; then
              echo "::error::org.opencontainers.image.$label is unset"
              exit 1
            fi
            echo "org.opencontainers.image.$label=$value"
          done

  # Not the required check — `gate` is. Without this the chart's only validation
  # is whatever someone ran by hand, and the first values change that breaks a
  # render lands green.
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CHART: deploy/helm/sessionlayer-dashboard
      # Floating tool versions are the hazard a floating image tag is. Both
      # downloads are checksum-verified below.
      HELM_VERSION: 3.19.0
      HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
      KUBECONFORM_VERSION: 0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
      # Schemas are fetched per run, so the Kubernetes version is pinned too;
      # otherwise the meaning of a green check moves under the chart.
      KUBE_VERSION: 1.31.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install helm and kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"

          curl -fsSLO "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-v${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "helm-v${HELM_VERSION}-linux-amd64.tar.gz" linux-amd64/helm
          mv linux-amd64/helm "$RUNNER_TEMP/bin/helm"

          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz -C "$RUNNER_TEMP/bin" kubeconform

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint, render and schema-check
        run: |
          set -euo pipefail
          helm lint "$CHART"

          # Unlike the other three charts, this one renders with no operator
          # input at all, because it holds no credential. Both the defaults and
          # the production values are checked.
          for values in "$CHART/values.yaml" "$CHART"/ci/*.yaml; do
            name=$(basename "$values" .yaml)
            echo "::group::$name"
            helm lint "$CHART" -f "$values"

            out="$RUNNER_TEMP/$name.rendered.yaml"
            helm template chart-ci "$CHART" -f "$values" > "$out"
            [ -s "$out" ] || { echo "::error::$name rendered nothing"; exit 1; }

            # A bare exit code cannot tell a clean run from an empty one:
            # kubeconform exits 0 over zero resources, and a resource whose
            # schema it never found is 'skipped', not failed.
            report=$(kubeconform -strict -summary -output json \
              -schema-location default -kubernetes-version "$KUBE_VERSION" "$out")
            echo "$report" | jq -c '.summary'
            echo "$report" | jq -e \
              '.summary.valid > 0 and .summary.invalid == 0
               and .summary.errors == 0 and .summary.skipped == 0' >/dev/null

            # A template that silently stops rendering still schema-validates.
            workloads=$(grep -c '^kind: Deployment$' "$out" || true)
            [ "$workloads" = 1 ] || { echo "::error::$name rendered $workloads Deployments, expected 1"; exit 1; }
            grep -qE '^          image: ghcr\.io/sessionlayer/dashboard[@:]' "$out" \
              || { echo "::error::$name rendered no dashboard image reference"; exit 1; }
            echo "::endgroup::"
          done

          # An unset connect-src allow-list must collapse to 'self' rather than
          # widening, so the default render carries no SL_CSP_CONNECT_SRC at all.
          if grep -q 'SL_CSP_CONNECT_SRC' "$RUNNER_TEMP/values.rendered.yaml"; then
            echo "::error::the default render sets SL_CSP_CONNECT_SRC; an unset allow-list must collapse connect-src to 'self'"
            exit 1
          fi
          grep -q 'SL_CSP_CONNECT_SRC' "$RUNNER_TEMP/production-values.rendered.yaml" \
            || { echo "::error::the production render does not set SL_CSP_CONNECT_SRC"; exit 1; }

      # The half with teeth. This chart holds no credential, so it has no secret
      # reference to demand; its controls are the values schema and the
      # structural guards, and those are what is asserted.
      - name: Assert the chart refuses an install it must refuse
        run: |
          set -euo pipefail
          prod="$CHART/ci/production-values.yaml"

          refuse() { # refuse <expected-substring> <command...>
            local want="$1"; shift
            local out rc
            set +e
            out=$("$@" 2>&1); rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error::expected a refusal naming '$want', but this succeeded: $*"
              exit 1
            fi
            case "$out" in
              *"$want"*) printf 'refused on %s\n' "$want" ;;
              *) echo "::error::refused, but not on '$want'. Actual output:"
                 printf '%s\n' "$out"
                 exit 1 ;;
            esac
          }

          # A cleartext origin in connect-src would let the page make
          # credential-bearing calls a network attacker can read.
          refuse "/csp/connectSrc" \
            helm lint "$CHART" --set 'csp.connectSrc={http://cp.example.com}'
          # A budget that refuses every voluntary eviction hangs a node drain.
          refuse "not below replicaCount" \
            helm template chart-ci "$CHART" -f "$prod" --set podDisruptionBudget.minAvailable=3

          # values.schema.json must reject a malformed values file rather than
          # rendering something surprising.
          refuse "/image/digest" \
            helm lint "$CHART" -f "$prod" --set image.digest=sha256:abc
          refuse "additional properties" \
            helm lint "$CHART" -f "$prod" --set replicaCoutn=2

      - name: helm package
        run: |
          set -euo pipefail
          helm package "$CHART" -d "$RUNNER_TEMP/packaged"
          ls -l "$RUNNER_TEMP/packaged"
