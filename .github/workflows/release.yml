# Supply-chain release pipeline: SBOM + SLSA provenance + keyless Sigstore
# signature + a reproducibility gate for the dist bundle. Separate from `ci.yml`
# (the required `gate` check) — this runs only on a `v*` tag push. Actions are
# SHA-pinned; the trailing comment records the human tag.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # gh release create/upload
      id-token: write # keyless cosign + provenance via ambient GitHub OIDC
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve artifact names and reproducible epoch
        run: |
          VER=${GITHUB_REF_NAME#v}
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "TARBALL=dashboard-${VER}-dist.tgz" >> "$GITHUB_ENV"
          echo "SBOM=dashboard-${VER}-sbom.cdx.json" >> "$GITHUB_ENV"

      - name: Build and package dist
        # The release bundle is an unconfigured evaluation artifact: Vite
        # inlines the endpoints and this workflow has none to give it. The
        # guard refuses that build unless it is told so deliberately, which
        # is what this says.
        env:
          SL_ALLOW_UNCONFIGURED_BUILD: '1'
        run: |
          npm run build
          ./.github/scripts/pack-dist.sh "$TARBALL"

      # Rebuild in a clean tree and assert an identical tarball digest.
      - name: Reproducibility gate
        # Same reason as the build above: both halves of the double-build must
        # run under the same environment or they are not comparable.
        env:
          SL_ALLOW_UNCONFIGURED_BUILD: '1'
        run: |
          sha256sum "$TARBALL" | awk '{print $1}' > first.sha256
          rm -rf dist "$TARBALL"
          npm run build
          ./.github/scripts/pack-dist.sh "$TARBALL"
          sha256sum "$TARBALL" | awk '{print $1}' > second.sha256
          if ! diff -q first.sha256 second.sha256 >/dev/null; then
            echo "::error::dist tarball is not reproducible ($(cat first.sha256) != $(cat second.sha256))"
            exit 1
          fi
          echo "reproducible sha256: $(cat first.sha256)"

      # CycloneDX 1.6 JSON. --output-reproducible drops metadata.timestamp
      # and serialNumber so the SBOM itself is byte-stable.
      - name: Generate SBOM
        run: |
          npm run sbom
          cp sbom.cdx.json "$SBOM"
          jq -e '.bomFormat=="CycloneDX" and .specVersion=="1.6" and (.components|length>0)' "$SBOM" >/dev/null

      # SLSA v1 provenance over the tarball + SBOM (Rekor-logged bundle).
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ env.TARBALL }}
            ${{ env.SBOM }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless blob signature over the tarball + SBOM. No key at rest; the
      # signing identity is this workflow's GitHub OIDC (Fulcio-issued short-lived
      # cert). Current cosign defaults to the new bundle format, which folds the
      # signature + certificate into the bundle and silently ignores
      # --output-signature/--output-certificate (warns, doesn't fail) — those
      # per-file outputs never actually exist, so a "Publish release" step that
      # globs for a standalone .sig file will not find one. The bundle is the
      # one artifact this actually produces; verify against it (see
      # docs/security/supply-chain.md).
      - name: Sign artifact and SBOM
        env:
          COSIGN_YES: 'true'
        run: |
          for f in "$TARBALL" "$SBOM"; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            "$TARBALL" "${TARBALL}.sigstore.json" \
            "$SBOM" "${SBOM}.sigstore.json" \
            "${{ steps.attest.outputs.bundle-path }}" \
            --clobber

  # The container image for the same tag, held to the integrity story the dist
  # tarball already has: multi-arch, SBOM and provenance attached to the index,
  # signed with the same keyless Sigstore identity — and verified in this job,
  # because a signature nobody checks is a claim rather than a control.
  #
  # No VITE_* build args: the endpoints Vite inlines are deployment-specific, so
  # the published image carries the localhost dev defaults and an operator
  # rebuilds it with their own (see deploy/README.md).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign + provenance via ambient GitHub OIDC
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No QEMU: dist/ is architecture-neutral and the serve stage runs no
      # commands, so neither platform needs emulation.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # sbom + provenance attach an SPDX document and SLSA provenance to the
      # index as in-toto attestations, one per platform. No :latest — a floating
      # tag is the hazard this project refuses everywhere else.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sessionlayer/dashboard:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # --recursive so every platform manifest is signed, not only the index.
      - name: Sign image
        env:
          COSIGN_YES: 'true'
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "ghcr.io/sessionlayer/dashboard@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/sessionlayer/dashboard
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Every assertion here names the value it expects. A step that only checks
      # an exit code cannot tell the outcome it wants from the one it fears.
      - name: Verify the published image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/sessionlayer/dashboard
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          REF="${IMAGE}@${DIGEST}"
          NAME="${IMAGE#ghcr.io/}"
          IDENTITY="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/"

          verify_signature() {
          	local target="$1" n
          	cosign verify \
          		--certificate-identity-regexp "$IDENTITY" \
          		--certificate-oidc-issuer https://token.actions.githubusercontent.com \
          		"$target" >/tmp/cosign.json
          	n=$(jq 'length' /tmp/cosign.json)
          	[ "$n" -ge 1 ] || { echo "::error::cosign verify returned no signatures for $target"; exit 1; }
          	echo "signature verified: $target ($n)"
          }

          # 1. The index, and then every platform manifest under it. `cosign sign` runs
          #    with --recursive precisely so the children are signed; verifying only the
          #    index would stay green if --recursive ever stopped doing that, and the
          #    child is what a node actually resolves the index to.
          verify_signature "$REF"

          INDEX=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}')
          CHILDREN=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture != "unknown") | .digest' <<<"$INDEX")
          [ -n "$CHILDREN" ] || { echo "::error::the index lists no linux platform manifests"; exit 1; }
          for child in $CHILDREN; do verify_signature "${IMAGE}@${child}"; done

          # 2. Exactly the platforms the release claims — not "at least". An unexpected
          #    third platform means something published that nobody reviewed.
          PLATFORMS=$(jq -r '[.manifests[].platform | select(.os == "linux" and .architecture != "unknown") | .architecture] | sort | unique | join(",")' <<<"$INDEX")
          [ "$PLATFORMS" = "amd64,arm64" ] || { echo "::error::index platforms are '$PLATFORMS', expected exactly 'amd64,arm64'"; exit 1; }
          echo "platforms: $PLATFORMS"

          # 3. Provenance, pinned to this workflow on this tag. The bare
          #    `gh attestation verify --repo` form accepts an attestation from any
          #    workflow in the repository, which is the weaker form our own supply-chain
          #    guide tells operators not to rely on.
          gh attestation verify "oci://${REF}" \
          	--repo "$GITHUB_REPOSITORY" \
          	--signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
          	--source-ref "refs/tags/${GITHUB_REF_NAME}"

          # 4. Every platform's SBOM carries components. Summing the counts and testing
          #    the sum passes when one platform's document is empty, and the platform
          #    whose SBOM silently empties is the one nobody looks at.
          #    Match on an SPDX *document* rather than on any object carrying a
          #    `packages` key: a nested empty array inside one document would otherwise
          #    fail the release for no reason.
          docker buildx imagetools inspect "$REF" --format '{{json .SBOM}}' >sbom.json
          SBOM_COUNTS='[.. | objects | select(has("spdxVersion") and has("packages")) | .packages | length]'
          jq -e "$SBOM_COUNTS | (length > 0) and (map(. > 0) | all)" sbom.json >/dev/null \
          	|| { echo "::error::an SBOM attestation is missing or lists no components"; exit 1; }
          echo "SBOM packages per platform: $(jq -c "$SBOM_COUNTS" sbom.json)"

          # 5. The tag an operator is told to pull resolves to the digest just verified.
          #    Everything above addresses the image by digest, so a tag that never landed
          #    or that a concurrent push moved would go unnoticed — and the tag is the
          #    first hop of the procedure the installation guides document.
          TAG_DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --format '{{json .Manifest}}' | jq -r '.digest')
          [ "$TAG_DIGEST" = "$DIGEST" ] \
          	|| { echo "::error::${IMAGE}:${GITHUB_REF_NAME} resolves to $TAG_DIGEST, not the verified $DIGEST"; exit 1; }
          echo "tag ${GITHUB_REF_NAME} -> $TAG_DIGEST"

          # 6. And an operator holding no credential can obtain it. A GHCR package
          #    created by a workflow is private until its visibility is set, and nothing
          #    in this pipeline sets it — so without this check the whole release goes
          #    green over an image no one can pull, while the installation guides open
          #    with `docker pull`. Use the registry's own anonymous token endpoint rather
          #    than `docker logout`, which does not account for credentials buildx may
          #    hold elsewhere.
          #
          #    "Unreachable" and "refused" must not collapse into one message. A blamed
          #    cause the check cannot actually distinguish is the same defect this whole
          #    step exists to remove, one level down: a transient network failure would
          #    otherwise be reported as a private package, sending someone to fix a
          #    permission that was never wrong.
          TOKEN_HTTP=$(curl -sSL --retry 3 --retry-connrefused --max-time 30 \
          	-o /tmp/ghcr-token.json -w '%{http_code}' \
          	"https://ghcr.io/token?scope=repository:${NAME}:pull&service=ghcr.io" || echo 000)
          case "$TOKEN_HTTP" in
          	200) ;;
          	000) echo "::error::could not reach ghcr.io's token endpoint — this check is INCONCLUSIVE, not a pass"; exit 1 ;;
          	*) echo "::error::ghcr.io refused an anonymous pull token for ${NAME} (HTTP $TOKEN_HTTP) — the package is private, so no operator can pull what this release published"; exit 1 ;;
          esac
          TOKEN=$(jq -r '.token // empty' /tmp/ghcr-token.json)
          [ -n "$TOKEN" ] \
          	|| { echo "::error::ghcr.io returned 200 with no token for ${NAME} — INCONCLUSIVE"; exit 1; }

          CODE=$(curl -sSL --retry 3 --retry-connrefused --max-time 30 -o /dev/null -w '%{http_code}' \
          	-H "Authorization: Bearer $TOKEN" \
          	-H "Accept: application/vnd.oci.image.index.v1+json" \
          	"https://ghcr.io/v2/${NAME}/manifests/${DIGEST}" || echo 000)
          case "$CODE" in
          	200) echo "anonymous pull: 200" ;;
          	000) echo "::error::could not reach ghcr.io to resolve ${IMAGE}@${DIGEST} — INCONCLUSIVE, not a pass"; exit 1 ;;
          	401|403) echo "::error::${IMAGE} is not anonymously pullable (HTTP $CODE) — the GHCR package is private"; exit 1 ;;
          	*) echo "::error::anonymous resolve of ${IMAGE}@${DIGEST} returned HTTP $CODE"; exit 1 ;;
          esac
