# Serving config for the Dashboard container image (deploy/Dockerfile). The
# operator-facing reference for a front proxy is nginx.conf; this one serves the
# built bundle directly on plain 8080, with TLS terminated upstream.
#
# The security headers and /config.js both come from the envsubst output
# directory on the tmpfs, because a read-only root filesystem cannot hold
# anything rendered at start.
# The include names one file rather than a wildcard: a wildcard that matches
# nothing is not an error in nginx, so a rendering failure would come up serving
# no security headers at all instead of refusing to start.

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  include /tmp/nginx/security-headers.conf;

  # Content-hashed assets - Vite fingerprints every file under /assets/, so a new
  # build yields a new URL; cache them immutably. nginx drops every inherited
  # add_header in a block that sets one of its own, so the include is repeated
  # wherever a location adds Cache-Control.
  location /assets/ {
    include /tmp/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Written by the entrypoint from this container's own environment, so it is
  # served from the tmpfs rather than from the bundle. An exact match, and an
  # alias rather than a root: if the entrypoint ever failed to write it this
  # 404s, where a fallback would quietly serve the bundle's empty placeholder.
  location = /config.js {
    include /tmp/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
    alias /tmp/nginx/config.js;
  }

  location / {
    include /tmp/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }
}
