{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sessionlayer-dashboard.fullname" . }}
  labels:
    {{- include "sessionlayer-dashboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sessionlayer-dashboard.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {{- if or .Values.networkPolicy.ingressFromPodSelector .Values.networkPolicy.ingressFromNamespaceSelector }}
      from:
        - {{- with .Values.networkPolicy.ingressFromNamespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
          {{- with .Values.networkPolicy.ingressFromPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- /*
    The browser fetches the API, the identity provider and the object store
    directly. Serving static files needs no egress beyond name resolution.
    */}}
    {{- with .Values.networkPolicy.dnsPodSelector }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
