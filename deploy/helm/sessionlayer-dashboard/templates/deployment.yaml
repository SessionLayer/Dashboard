{{- if not .Values.endpoints.cpBaseUrl }}
{{- fail "sessionlayer-dashboard: endpoints.cpBaseUrl is required. The image carries no endpoint of its own - it reads one from the environment at start - so without this the container refuses to come up and the install would be a crash loop. Set it to the Control Plane the browser will reach, e.g. endpoints.cpBaseUrl=https://cp.example.com." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sessionlayer-dashboard.fullname" . }}
  labels:
    {{- include "sessionlayer-dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sessionlayer-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sessionlayer-dashboard.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sessionlayer-dashboard.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "sessionlayer-dashboard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- /*
            The image reads these at start and writes them where the bundle can
            see them, deriving the CSP connect-src from the same values in the
            same pass. There is deliberately no way to set connect-src by hand.
            */}}
            - name: SL_CP_BASE_URL
              value: {{ .Values.endpoints.cpBaseUrl | quote }}
            {{- range $name, $value := (dict
                  "SL_OIDC_ISSUER" .Values.endpoints.oidcIssuer
                  "SL_OIDC_CLIENT_ID" .Values.endpoints.oidcClientId
                  "SL_OIDC_AUTHORIZE_ENDPOINT" .Values.endpoints.oidcAuthorizeEndpoint
                  "SL_OIDC_TOKEN_ENDPOINT" .Values.endpoints.oidcTokenEndpoint
                  "SL_OIDC_REDIRECT_URI" .Values.endpoints.oidcRedirectUri
                  "SL_OIDC_SCOPE" .Values.endpoints.oidcScope) }}
            {{- if $value }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.endpoints.objectStoreOrigins }}
            - name: SL_OBJECT_STORE_ORIGIN
              value: {{ join " " . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            {{- toYaml .Values.tmpVolume | nindent 12 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
