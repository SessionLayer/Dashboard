replicaCount: 2

image:
  # The published image bakes in no endpoints: it reads them from the
  # environment below at start, so this one image serves any deployment.
  repository: ghcr.io/sessionlayer/dashboard
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# Endpoints the container writes into the bundle at start, and derives the
# Content-Security-Policy connect-src from at the same moment - so a browser can
# never be given an endpoint the policy then blocks.
#
# https is required for anything that is not loopback, and the container refuses
# to start otherwise. cpBaseUrl has no default: without one this chart refuses
# to render, rather than install a console that reaches nothing.
endpoints:
  cpBaseUrl: ""
  oidcIssuer: ""
  oidcClientId: ""
  # Defaulted from oidcIssuer when left empty; set them for an issuer whose
  # endpoints are not at the conventional paths.
  oidcAuthorizeEndpoint: ""
  oidcTokenEndpoint: ""
  # Defaulted by the app to this console's own origin + /auth/callback.
  oidcRedirectUri: ""
  oidcScope: ""
  # The browser downloads the still-encrypted recording straight from the signed
  # URL, so the object store's origin has to be allowed. It is the one origin
  # the app fetches that is not one of the endpoints above.
  objectStoreOrigins: []

service:
  type: ClusterIP
  annotations: {}
  port: 80

containerPort: 8080

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  # uid 101 is the unprivileged nginx user in the base image, which listens on
  # 8080 rather than 80 so no privileged bind is ever needed.
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# nginx keeps its pid file, its client and proxy temp paths, and the config it
# renders from the environment at start, all under /tmp. That makes this the
# only writable path the image needs, and a read-only root filesystem holds.
tmpVolume:
  medium: Memory
  sizeLimit: 16Mi

probes:
  readiness:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 15
    timeoutSeconds: 1
    failureThreshold: 3
  startup:
    enabled: true
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 15

terminationGracePeriodSeconds: 30

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # The browser fetches the API, the identity provider and the object store
  # directly, so nothing but DNS leaves this pod. Serving static files needs no
  # egress at all.
  dnsPodSelector:
    k8s-app: kube-dns
  # Empty accepts ingress on the container port from anywhere in the cluster,
  # which is what an ingress controller in an arbitrary namespace needs. Set it
  # to your controller's labels to narrow that.
  ingressFromPodSelector: {}
  ingressFromNamespaceSelector: {}
  extraIngress: []
  extraEgress: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
